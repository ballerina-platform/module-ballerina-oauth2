# ballerina:13 / ballerina:14 now only match `clientId: clientId, clientSecret: clientSecret` and
# `customHeaders: {"Authorization": stsAuthorization}`; clientId, clientSecret and stsAuthorization are all
# `configurable string ... = ?` with no default in code (values come from Config.toml). Identifier-name matches only.
[rule]
exclude = ["ballerina:13", "ballerina:14"]
